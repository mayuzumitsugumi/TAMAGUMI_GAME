<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171427">
  <meta name="description" content="TAMAGUMI 離線電子寵物">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171427;color:#fff;font-family:system-ui,sans-serif}
    #game{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    #canvas{width:100%;height:100%;outline:none;image-rendering:pixelated;touch-action:manipulation}
    #backup-file{display:none}
  </style>
</head>
<body>
  <input id="backup-file" type="file" accept="application/json,.json" hidden>
  <main id="game"><canvas id="canvas"></canvas></main>
  <script>
    window.tamagumiChooseBackup = () => document.getElementById('backup-file').click();
    document.getElementById('backup-file').addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (file.size > 2_000_000) { alert('備份檔過大'); return; }
      const text = await file.text();
      if (window.tamagumiReceiveBackup) window.tamagumiReceiveBackup([text]);
      event.target.value = '';
    });
  </script>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    engine.startGame({canvas: document.getElementById('canvas')}).catch((error) => {
      console.error(error);
      document.getElementById('game').textContent = '遊戲載入失敗，請重新載入。';
    });
  </script>
</body>
</html>
